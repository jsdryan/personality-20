<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>人格二十題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1C2321; --muted:#5E6A66; --line:#D5DBD8; --track:#E3E8E5;
  --accent:#1F5F5B; --accent-ink:#FFFFFF; --accent-soft:#E1EEEC;
  --accent2:#8A4B5E; --accent2-soft:#F1E3E7;
  --warn-soft:#F5EEDB; --warn:#7A5A12;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A18; --surface:#1D2523; --ink:#E8ECEA; --muted:#9AA6A1; --line:#2E3835; --track:#2A3431;
    --accent:#6FC2B9; --accent-ink:#0F1F1D; --accent-soft:#1F3532;
    --accent2:#D48CA2; --accent2-soft:#3A2630;
    --warn-soft:#3A3220; --warn:#E5C36A;
  }
}
:root[data-theme="dark"]{
  --bg:#141A18; --surface:#1D2523; --ink:#E8ECEA; --muted:#9AA6A1; --line:#2E3835; --track:#2A3431;
  --accent:#6FC2B9; --accent-ink:#0F1F1D; --accent-soft:#1F3532;
  --accent2:#D48CA2; --accent2-soft:#3A2630;
  --warn-soft:#3A3220; --warn:#E5C36A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:24px 64px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:700;text-wrap:balance;line-height:1.3}
h1{font-size:2rem;letter-spacing:.02em}
h2{font-size:1.25rem;margin-top:6px}
h3{font-size:1.05rem}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.note{font-size:.85rem;color:var(--muted)}
.brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.brand .titles{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .lede{font-size:.95rem;color:var(--muted);max-width:32em}
.controls{display:flex;gap:6px;flex:0 0 auto}
.chip{font:inherit;font-size:.8rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.view{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.notice{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:.93rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.9rem;font-weight:500}
.field input[type=text],.field input[type=url]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field.inline{flex-direction:row;align-items:stretch;gap:8px}
.field.inline .btn{white-space:nowrap;flex:0 0 auto}
.check{display:flex;align-items:center;gap:8px;font-size:.93rem}
.check input{width:18px;height:18px;accent-color:var(--accent)}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-weight:500;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:.88rem}

.progress{display:flex;flex-direction:column;gap:8px}
.progress-row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--track);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease}
.statement{font-family:var(--serif);font-size:1.3rem;line-height:1.55;font-weight:600}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
@media (hover:hover){.opt:hover{border-color:var(--accent)}}
.opt .k{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--track);color:var(--muted);font-variant-numeric:tabular-nums}
.opt .t{display:flex;flex-direction:column;line-height:1.35}
.opt .t small{color:var(--muted);font-size:.8rem}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}

.type-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.type-letters{font-family:var(--serif);font-size:3.4rem;font-weight:700;letter-spacing:.08em;line-height:1.1;color:var(--accent)}
.type-letters .identity{font-size:1.6rem;letter-spacing:.02em;color:var(--muted);margin-left:.15em}
.type-letters.b{color:var(--accent2)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.06em}
td.l{font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap}
td.c,th.c{white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow-x:auto}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.78rem;background:var(--accent-soft);color:var(--accent);font-weight:500;white-space:nowrap}
.pill.mid{background:var(--track);color:var(--muted)}
.pill.b{background:var(--accent2-soft);color:var(--accent2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.traits{display:flex;flex-direction:column;gap:14px}
.trait{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline}
.trait-name{font-weight:500}
.trait-name small{color:var(--muted);font-weight:400;margin-left:6px;font-size:.8rem}
.trait-pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.trait-pct .b{color:var(--accent2);font-weight:500;margin-left:8px}
.track{grid-column:1 / -1;position:relative;height:10px;background:var(--track);border-radius:999px;overflow:hidden}
.track .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
.track .fill.b{background:var(--accent2);opacity:.9;height:4px;top:auto;bottom:0}
.track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--surface)}
.trait-desc{grid-column:1 / -1;font-size:.93rem;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

.obs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.obs li{padding:14px 16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 12px 12px 0;font-size:.95rem}
.obs li b{font-family:var(--serif)}
.obs li.b{border-left-color:var(--accent2)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px}
summary{cursor:pointer;padding:12px 0;font-weight:500}
details > :last-child{margin-bottom:12px}
.miss{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.miss li{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:.92rem}
.miss li .vs{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:.85rem}
.cardimg img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

    <div class="titles">

      <button class="chip" type="button" id="lang-btn"></button>
      <button class="chip" type="button" id="theme-btn"></button>
    </div>

  <main id="app" class="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

    {t:"交代給我的事，我通常會提前完成，而不是拖到最後一刻。", e:"I usually finish assigned tasks early instead of at the last minute.", tr:"C", k:1, a:"會提前完成", d:"常拖到最後一刻", ae:"finishes early", de:"tends to leave things to the last minute"},

       {t:"朋友臨時約我出門，我心裡的第一反應是「有點負擔」多過「太好了」。", e:"When a friend invites me out on short notice, my first reaction is more \"a bit of a burden\" than \"great\".", k:-1},

       {t:"買東西或選餐廳，我通常會回頭選用過、吃過的。", e:"When shopping or picking a restaurant, I usually go back to what I've already tried.", k:-1},

       lv:{zh:["偏內向。靠獨處充電，社交後需要時間恢復。","中間型。看場合，有時想找人，有時想獨處。","偏外向。跟人互動會充電，樂於主動開口。"],

    ORDER.forEach(function(tr){ var g = shown(tr, rg.pct[tr]), a = shown(tr, ra.pct[tr]), d = g - a; h += '<tr><td>' + trName(tr) + '</td><td class="num">' + g + '%</td><td class="num">' + a + '%</td><td class="num">' + (d > 0 ? "+" : "") + d + '</td></tr>'; });
    h += '</table><div class="eyebrow">' + t("accMiss") + '</div>';
    if (misses.length) { h += '<ul class="miss">'; misses.forEach(function(m){ var it = ITEMS[m.i]; h += '<li>' + esc(quote(itemText(it))) + '<div class="vs"><span class="pill b">' + t("guessed") + (L === "en" ? ": " : "：") + esc(choiceLabel(guessAns[m.i], target)) + '</span><span class="pill">' + t("actual") + (L === "en" ? ": " : "：") + esc(choiceLabel(actual[m.i], target)) + '</span></div></li>'; }); h += '</ul>'; }
    else h += '<p class="muted small">' + t("accMissNone") + '</p>';
    return h + '</div>';
  }
  function viewAccuracy(){
    var h = '<h2>' + t("accTitle") + '</h2>', any = false;
    var meName = S.me && S.me.name || t("you");
    if (S.guess && S.guess.done && S.partner) { any = true; h += accuracyBlock(meName, S.partner.name || S.guess.target || t("someone"), S.guess.answers, S.partner.answers, S.partner); }
    if (S.guessOfMe && S.me && S.me.done) { any = true; h += accuracyBlock(S.guessOfMe.by || t("someone"), meName, S.guessOfMe.answers, S.me.answers, S.me); }
    if (!any) h += '<div class="card"><p>' + t("accNone") + '</p><ol><li>' + t("accHow1") + '</li><li>' + t("accHow2") + '</li></ol></div>';
    h += '<div class="actions">' + btn("b-compare", t("compare")) + btn("b-result", t("myResult"), "ghost") + btn("b-home", t("home"), "ghost") + '</div>';
    return h;
  }

  function pasteBox(){ return '<div class="card"><div class="field"><label for="paste">' + t("pasteLabel") + '</label><div class="field inline"><input id="paste" type="url" placeholder="' + t("pastePh") + '">' + btn("b-import", t("importBtn")) + '</div></div></div>'; }
  function viewCompare(){
    var h = '<h2>' + t("cmpTitle") + '</h2>';
    if (!(S.me && S.me.done)) return h + '<div class="notice">' + t("cmpNeedMe") + '</div><div class="actions">' + btn("b-home", t("home"), "primary") + '</div>';
    if (!S.partner) return h + '<div class="notice">' + t("cmpNeedPartner") + '</div>' + pasteBox() + '<div class="actions">' + btn("b-result", t("myResult"), "ghost") + '</div>';
    var me = S.me, pt = S.partner, r1 = score(me.answers, me.follow), r2 = score(pt.answers, pt.follow), n1 = whoName(me), n2 = pt.name ? esc(pt.name) : t("someone");
    h += '<div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">' + n1 + '</div><div class="type-letters" style="font-size:2.2rem">' + r1.type + '<span class="identity">-' + r1.letters.N + '</span></div></div><div><div class="eyebrow">' + n2 + '</div><div class="type-letters b" style="font-size:2.2rem">' + r2.type + '<span class="identity">-' + r2.letters.N + '</span></div></div></div>' +
      '<table><tr><th>' + t("group") + '</th><th class="c">' + n1 + '</th><th class="c">' + n2 + '</th><th class="c"></th></tr>';
    var same = [], diff = [];
    ["E","O","A","C","N"].forEach(function(tr){ var a = r1.letters[tr], b = r2.letters[tr], eq = a === b; if (tr !== "N") (eq ? same : diff).push(tr); h += '<tr><td>' + tx(TRAITS[tr].q) + '</td><td class="c l">' + (tr === "N" ? "-" : "") + a + '</td><td class="c l">' + (tr === "N" ? "-" : "") + b + '</td><td class="c"><span class="pill' + (eq ? " mid" : " b") + '">' + (eq ? t("same") : t("diff")) + '</span></td></tr>'; });
    h += '</table></div>';
    h += '<h2>' + t("big5") + '</h2>' + traitBars(me, pt, n1, n2);
    var gaps = ORDER.map(function(tr){ return {tr: tr, g: Math.abs(shown(tr, r1.pct[tr]) - shown(tr, r2.pct[tr]))}; }).sort(function(a, b){ return b.g - a.g; });
    var sum = same.length ? t("sameLetters", {list: same.map(function(tr){ return r1.letters[tr]; }).join(sep())}) : "";
    if (!diff.length) sum += " " + t("diffNone");
    if (gaps[0].g >= 25) sum += " " + t("biggestGap", {trait: trName(gaps[0].tr), g: gaps[0].g});
    h += '<div class="notice">' + sum + " " + t("sameNote") + '</div>';
    var hintTr = diff.slice(); if (r1.letters.N !== r2.letters.N) hintTr.push("N");
    if (hintTr.length) { h += '<h2>' + t("hintsTitle") + '</h2><ul class="obs">'; hintTr.forEach(function(tr){ h += '<li class="b"><b>' + r1.letters[tr] + " / " + r2.letters[tr] + '</b>' + (L === "en" ? ": " : "：") + tx(HINTS[tr]) + '</li>'; }); h += '</ul>'; }
    h += '<div class="actions">' + btn("b-acc", t("accTitle")) + btn("b-guess", t("guessThem", {name: n2})) + btn("b-result", t("myResult"), "ghost") + btn("b-replace", t("replacePartner"), "ghost") + '</div>' + pasteBox();
    return h;
  }

  function fmtDate(ts){ var d = new Date(ts); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
  function viewHistory(){
    var h = '<h2>' + t("histTitle") + '</h2>';
    if (!S.history.length) return h + '<p class="muted">' + t("histNone") + '</p><div class="actions">' + btn("b-home", t("home"), "ghost") + '</div>';
    h += '<p class="note">' + t("histDelta") + ' ' + t("histNote") + '</p><div class="tbl"><table><tr><th>' + t("histDate") + '</th><th>' + t("histType") + '</th>';
    ORDER.forEach(function(tr){ h += '<th class="num">' + trShort(tr) + '</th>'; });
    h += '<th></th></tr>';
    S.history.forEach(function(rec, i){
      var r = score(rec.answers), prev = S.history[i + 1] ? score(S.history[i + 1].answers) : null;
      h += '<tr><td class="c">' + fmtDate(rec.ts) + '</td><td class="l">' + r.type + '</td>';
      ORDER.forEach(function(tr){ var v = shown(tr, r.pct[tr]), d = prev ? v - shown(tr, prev.pct[tr]) : null; h += '<td class="num">' + v + (d === null ? "" : ' <span class="muted">(' + (d > 0 ? "+" : "") + d + ')</span>') + '</td>'; });
      h += '<td class="c"><button class="btn sm ghost" type="button" data-del="' + i + '">' + t("del") + '</button></td></tr>';
    });
    h += '</table></div><div class="actions">' + btn("b-result", t("myResult")) + btn("b-home", t("home"), "ghost") + '</div>';
    return h;
  }

  function viewCard(){ return '<h2>' + t("cardTitle") + '</h2><p class="note">' + t("cardNote") + '</p><div class="cardimg" id="cardimg"></div><div class="actions"><a class="btn primary" id="b-dl" download="' + t("title") + '.png" href="#">' + t("download") + '</a>' + btn("b-result", t("back"), "ghost") + '</div>'; }
  function drawCard(p){
    var r = score(p.answers, p.follow), W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
    var ctx = c.getContext("2d");
    var serif = '"Noto Serif TC","Songti TC","PMingLiU",serif', sans = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif';
    ctx.fillStyle = "#F3F5F2"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#FFFFFF"; roundRect(ctx, 60, 60, W - 120, H - 120, 28); ctx.fill();
    ctx.fillStyle = "#5E6A66"; ctx.font = "500 26px " + sans; ctx.fillText(t("eyebrow"), 120, 150);
    ctx.fillStyle = "#1C2321"; ctx.font = "700 48px " + serif; ctx.fillText(p.name || t("title"), 120, 215);
    ctx.fillStyle = "#1F5F5B"; ctx.font = "700 190px " + serif; ctx.fillText(r.type, 120, 420);
    var tw = ctx.measureText(r.type).width; ctx.fillStyle = "#5E6A66"; ctx.font = "700 72px " + serif; ctx.fillText("-" + r.letters.N, 120 + tw + 16, 420);
    ctx.fillStyle = "#5E6A66"; ctx.font = "400 30px " + sans; ctx.fillText(t("alt", {alt: r.altType, pair: TRAITS[r.weakest].hi + "/" + TRAITS[r.weakest].lo}).replace(/<[^>]+>/g, ""), 120, 480);
    var y = 580;
    ORDER.forEach(function(tr){
      var v = shown(tr, r.pct[tr]);
      ctx.fillStyle = "#1C2321"; ctx.font = "500 34px " + sans; ctx.fillText(trName(tr), 120, y);
      ctx.fillStyle = "#1F5F5B"; ctx.font = "700 34px " + sans; ctx.textAlign = "right"; ctx.fillText(v + "%", W - 120, y); ctx.textAlign = "left";
      ctx.fillStyle = "#E3E8E5"; roundRect(ctx, 120, y + 22, W - 240, 22, 11); ctx.fill();
      ctx.fillStyle = "#1F5F5B"; roundRect(ctx, 120, y + 22, Math.max(22, (W - 240) * v / 100), 22, 11); ctx.fill();
      ctx.fillStyle = "#5E6A66"; ctx.font = "400 26px " + sans; ctx.fillText(TRAITS[tr].lv[L][level(v)], 120, y + 84);
      y += 130;
    });
    ctx.fillStyle = "#5E6A66"; ctx.font = "400 26px " + sans; ctx.fillText(t("cardDate") + " " + fmtDate(p.ts || Date.now()), 120, H - 110);
    ctx.textAlign = "right"; ctx.fillText(baseUrl().replace(/^https?:\/\//, ""), W - 120, H - 110); ctx.textAlign = "left";
    return c;
  }
  function roundRect(ctx, x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

  /* ============================== 綁定 ============================== */
  function bind(v){
    var nameEl = $("name"); if (nameEl) nameEl.addEventListener("input", function(){ S.me = S.me || {name: "", answers: [], follow: {}, done: false}; S.me.name = nameEl.value.trim(); save(); });
    var sh = $("shuffle"); if (sh) sh.addEventListener("change", function(){ S.shuffle = sh.checked; save(); });
    if ($("opts")) bindRun();
    on("b-start", function(){ startRun("me"); render(); scrollToQuiz(); });
    on("b-result", function(){ go("result"); });
    on("b-view", function(){ go("view"); });
    on("b-home", function(){ go("home"); }); on("b-home2", function(){ go("home"); });
    on("b-back", function(){ go(S.me && S.me.done ? "result" : "home"); });
    on("b-compare", function(){ go("compare"); });
    on("b-history", function(){ go("history"); });
    on("b-acc", function(){ go("accuracy"); });
    on("b-guess", function(){ go("guessSetup"); });
    on("b-guess-them", function(){ go("guessSetup"); });
    on("b-start-guess", function(){ var tg = ($("target").value || "").trim(); startRun("guess", tg); go("guessQuiz"); });
    on("b-glink", function(){ copyText(guessLink(S.guess, S.me && S.me.name || ""), t("linkCopied")); });
    on("b-link", function(){ copyText(resultLink(S.me), t("linkCopied")); });
    on("b-copy", function(){ copyText(resultText(S.me)); });
    on("b-follow", function(){ var r = score(S.me.answers, S.me.follow), keys = []; r.midline.forEach(function(tr){ keys.push(tr + "0", tr + "1", tr + "2"); }); startRun("follow", "", keys); go("follow"); });
    on("b-redo", function(){ if (!confirm(t("resetConfirm"))) return; S.me = {name: S.me && S.me.name || "", answers: [], follow: {}, done: false}; S.run = null; go("home"); });
    on("b-replace", function(){ S.partner = null; go("compare"); });
    on("b-import", function(){ if (importLink($("paste").value)) render(); });
    on("b-card", function(){ go("card"); });
    Array.prototype.forEach.call(app.querySelectorAll("[data-del]"), function(b){ b.addEventListener("click", function(){ S.history.splice(Number(b.getAttribute("data-del")), 1); save(); render(); }); });
    if (v === "card") {
      var draw = function(){ var c = drawCard(S.me), url = c.toDataURL("image/png"); var img = new Image(); img.src = url; img.alt = t("cardTitle"); $("cardimg").innerHTML = ""; $("cardimg").appendChild(img); $("b-dl").href = url; };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw, draw); else draw();
    }
  }

  /* ============================== 啟動 ============================== */
  if (location.hash.length > 1) { if (importLink(location.hash, true)) { try { history.replaceState(null, "", baseUrl()); } catch (e) {} } }
  if (S.run && S.run.kind === "me") S.view = "home";
  render();
})();
</script>

</body>
